<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Bar (Suppressed for Login per rule, but following Brand Identity) -->
<header class="bg-white/95 backdrop-blur-sm border-b border-slate-200 shadow-[0_4px_15px_rgba(0,43,73,0.06)] fixed top-0 left-0 right-0 z-40">
<div class="flex justify-between items-center w-full px-6 h-16 max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<span class="text-xl font-black text-[#002B49] uppercase tracking-wider">PFZ Predict</span>
</div>
<div class="flex items-center gap-4">
<a class="text-slate-500 font-medium hover:text-[#002B49] transition-all" href="#">Support</a>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-margin ocean-bg mt-16 relative">
<div class="ocean-texture"></div>
<!-- Decorative Elements for Maritime Feel -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-secondary/10 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-primary-fixed-dim/10 rounded-full blur-3xl"></div>
</div>
<!-- Login Card -->
<div class="w-full max-w-md z-10">
<div class="bg-white rounded-xl shadow-[0_4px_15px_rgba(0,43,73,0.06)] p-lg border border-primary-container/5">
<div class="text-center mb-lg">
<h1 class="font-display-lg text-display-lg text-primary mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your maritime intelligence dashboard</p>
</div>
<form class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[18px]">mail</span>
                            EMAIL ADDRESS
                        </label>
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-on-surface" id="email" name="email" placeholder="captain@vessel-id.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">lock</span>
                                PASSWORD
                            </label>
<a class="font-label-bold text-label-bold text-secondary hover:underline" href="#">FORGOT?</a>
</div>
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all font-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-white py-sm rounded-lg font-title-sm text-title-sm shadow-lg hover:bg-primary transition-all active:scale-95 duration-200 flex items-center justify-center gap-2 mt-lg" type="submit">
                        Login to Dashboard
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Footnote / Registration Link -->
<div class="mt-lg pt-lg border-t border-surface-container-high text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        New vessel in the fleet? 
                        <a class="text-secondary font-label-bold text-label-bold ml-1 hover:underline" href="#">REGISTER NOW</a>
</p>
</div>
</div>
<!-- Trust Indicator / Branding -->
