<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#2c0800",
                    "on-tertiary-fixed": "#380c00",
                    "on-primary-container": "#7293b6",
                    "tertiary-fixed": "#ffdbcf",
                    "primary-fixed-dim": "#a8caef",
                    "on-tertiary-fixed-variant": "#822800",
                    "surface-container-highest": "#e0e3e5",
                    "secondary-container": "#76f3ea",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#f7f9fb",
                    "surface-bright": "#f7f9fb",
                    "on-tertiary-container": "#e66c3f",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f2f4f6",
                    "secondary": "#006a65",
                    "surface-variant": "#e0e3e5",
                    "on-secondary": "#ffffff",
                    "on-primary": "#ffffff",
                    "primary": "#001629",
                    "outline-variant": "#c3c7ce",
                    "tertiary-container": "#4f1500",
                    "surface-dim": "#d8dadc",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#006f69",
                    "on-surface-variant": "#42474d",
                    "outline": "#73777e",
                    "secondary-fixed-dim": "#59dad1",
                    "surface-tint": "#406182",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed-variant": "#00504c",
                    "on-tertiary": "#ffffff",
                    "inverse-primary": "#a8caef",
                    "on-background": "#191c1e",
                    "surface-container": "#eceef0",
                    "on-surface": "#191c1e",
                    "primary-container": "#002b49",
                    "inverse-on-surface": "#eff1f3",
                    "secondary-fixed": "#79f6ed",
                    "inverse-surface": "#2d3133",
                    "on-secondary-fixed": "#00201e",
                    "tertiary-fixed-dim": "#ffb59c",
                    "primary-fixed": "#cfe5ff",
                    "surface-container-high": "#e6e8ea",
                    "on-primary-fixed-variant": "#274969",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#001d34",
                    "background": "#f7f9fb"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "20px",
                    "margin": "24px",
                    "xs": "8px",
                    "sm": "16px",
                    "md": "24px",
                    "lg": "32px",
                    "base": "4px",
                    "xl": "48px"
            },
            "fontFamily": {
                    "title-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "data-mono": ["Work Sans"],
                    "label-bold": ["Work Sans"],
                    "body-sm": ["Inter"],
                    "display-lg": ["Inter"]
            },
            "fontSize": {
                    "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "data-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                    "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-overlay-gradient {
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 43, 73, 0.05) 100%);
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface overflow-hidden">
<!-- TopAppBar -->
<header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-sm docked full-width top-0 z-40 border-b border-slate-200 dark:border-slate-800 shadow-[0_4px_15px_rgba(0,43,73,0.06)] flex justify-between items-center w-full px-6 h-16 fixed">
<div class="flex items-center gap-8">
<span class="text-xl font-black text-[#002B49] dark:text-white uppercase tracking-wider font-title-sm">PFZ Predict</span>
<nav class="hidden md:flex gap-6">
<a class="text-slate-500 dark:text-slate-400 font-medium font-body-sm hover:text-[#002B49] dark:hover:text-sky-300 transition-all active:scale-95 duration-200" href="#">Dashboard</a>
<a class="text-[#002B49] dark:text-sky-300 font-bold border-b-2 border-[#002B49] pb-1 font-body-sm active:scale-95 duration-200" href="#">Map</a>
<a class="text-slate-500 dark:text-slate-400 font-medium font-body-sm hover:text-[#002B49] dark:hover:text-sky-300 transition-all active:scale-95 duration-200" href="#">Logs</a>
</nav>
</div>
<div class="flex items-center gap-4">
<div class="relative hidden sm:block">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
<input class="pl-10 pr-4 py-1.5 bg-surface-container rounded-full border-none focus:ring-2 focus:ring-secondary text-body-sm w-64" placeholder="Search coordinates..." type="text"/>
</div>
<button class="text-slate-500 hover:text-primary transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-slate-500 hover:text-primary transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant">
<img alt="User profile" class="w-full h-full object-cover" data-alt="professional headshot of a sea captain or marine analyst in a neutral setting with soft natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGFLnaPpimo2DKOokpPA7guWuHsSAtgGLE4SZHr1GX5_YCiuxFaAnpvkSGz0lYx1BxpJyoHDKdS6GIFHg5fOktC-hFdjvNzvlRtosu6rR4cIToM53xzqeB0D6AXm8fZiVCrI6wETwB5ht0d6k0Qcn-MKL3nNVQSj0vadFJpp3flr0kydtdCv1tX95gt4KUYgMsP550j0tD8bZWVfTS6o39sKSDTJBaCF9VkIXgrDzw_OZ5E1AgxPxpE1XJ6dR2I1bCTmC12ero"/>
</div>
</div>
</header>
<!-- Main Map Canvas -->
<main class="relative w-full h-screen pt-16">
<!-- Map Container -->
<div class="absolute inset-0 bg-primary-container z-0">
<img alt="Maritime Map" class="w-full h-screen object-cover opacity-60" data-alt="detailed topographic ocean floor bathymetry map showing deep trenches and continental shelves in shades of deep navy and electric blue" data-location="North Atlantic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSMihmrXqThpH4gPCzAmrF9GFXAJ9IxZXT4arLFCTdb5Ag7PPy1uOiF6zhwMhBN5rpnU9cKS7UPeaEKZhhbaXbyhYQ4IkIHW2hH-cfp3ot-tV46kyezUx5duTScRuxYGQ0qawJx3m5vSZo90VfYtYy1ePf1-O1Jhr2OLXW_a3_yRsLQICzHuZkwWrBPpRVY92FqyUQg6-SrNo8MgF1uWgjMYEZxo6LeKDVs9mDepKna3b6Z5zDQVcKF0d7N4PHsS5VLGYB-RdL"/>
<div class="absolute inset-0 map-overlay-gradient pointer-events-none"></div>
<!-- Heatmap Overlays (Visual simulation) -->
<div class="absolute top-1/3 left-1/4 w-64 h-64 bg-secondary/20 blur-[60px] rounded-full"></div>
<div class="absolute bottom-1/4 right-1/3 w-80 h-80 bg-error/10 blur-[80px] rounded-full"></div>
<div class="absolute top-1/2 right-1/4 w-48 h-48 bg-on-tertiary-container/15 blur-[50px] rounded-full"></div>
<!-- Custom Map Markers -->
<!-- High Probability (Green) -->
<div class="absolute top-[45%] left-[42%] group cursor-pointer">
<div class="relative">
<div class="absolute inset-0 bg-secondary rounded-full animate-ping opacity-25"></div>
<div class="w-6 h-6 bg-secondary border-2 border-white rounded-full shadow-lg flex items-center justify-center relative z-10">
<span class="w-2 h-2 bg-white rounded-full"></span>
</div>
</div>
</div>
<!-- Low Probability (Red) -->
<div class="absolute top-[30%] left-[60%] cursor-pointer">
<div class="w-4 h-4 bg-error border-2 border-white rounded-full shadow-lg"></div>
</div>
<!-- User Location Marker -->
<div class="absolute top-[55%] left-[52%]">
<div class="flex flex-col items-center">
<div class="bg-primary text-white text-[10px] px-2 py-0.5 rounded-sm mb-1 font-label-bold">MY VESSEL</div>
<div class="w-8 h-8 flex items-center justify-center bg-white rounded-full shadow-xl">
<span class="material-symbols-outlined text-primary text-xl">sailing</span>
</div>
</div>
</div>
<!-- Selected Zone Popup (Target Component) -->
<div class="absolute top-[48%] left-[44%] z-20">
<div class="bg-white rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-outline-variant w-72 overflow-hidden animate-in fade-in slide-in-from-bottom-4 duration-300">
<div class="bg-primary-container p-4 flex justify-between items-center">
<div>
<h3 class="text-white font-title-sm">Zone Alpha-7</h3>
<p class="text-on-primary-container text-[10px] uppercase font-label-bold tracking-widest">High Potential PFZ</p>
</div>
<div class="bg-secondary/20 text-secondary px-2 py-1 rounded text-[10px] font-bold">94% MATCH</div>
</div>
<div class="p-4 space-y-4">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1">
<span class="text-slate-500 text-[10px] font-label-bold uppercase">SST</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-secondary">device_thermostat</span>
<span class="font-data-mono text-title-sm text-primary">24.2°C</span>
</div>
</div>
<div class="space-y-1">
<span class="text-slate-500 text-[10px] font-label-bold uppercase">Chlorophyll</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-secondary">opacity</span>
<span class="font-data-mono text-title-sm text-primary">0.45 <span class="text-[10px] text-slate-400">mg/m³</span></span>
</div>
</div>
</div>
<div class="pt-3 border-t border-slate-100">
<div class="flex justify-between items-end mb-2">
<span class="text-slate-500 text-[10px] font-label-bold uppercase">Fish Probability</span>
<span class="text-secondary font-bold text-body-sm">Optimal</span>
</div>
<div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
<div class="bg-secondary h-full w-[94%]"></div>
</div>
</div>
<button class="w-full bg-primary-container text-white py-2 rounded-lg font-label-bold hover:bg-primary transition-all active:scale-[0.98]">
                            SET NAVIGATION COURSE
                        </button>
</div>
</div>
</div>
</div>
<!-- Floating UI Elements -->
<!-- Legend & Map Controls -->
<div class="absolute bottom-10 left-10 z-30 flex flex-col gap-4">
<div class="bg-white/90 backdrop-blur-md p-4 rounded-xl shadow-lg border border-white/50 w-48">
<h4 class="text-[10px] font-label-bold uppercase text-slate-500 mb-3 tracking-widest">Zone Legend</h4>
<div class="space-y-2">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-secondary"></div>
<span class="text-body-sm text-primary font-medium">High (90-100%)</span>
</div>
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-on-tertiary-container"></div>
<span class="text-body-sm text-primary font-medium">Medium (50-89%)</span>
</div>
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-error"></div>
<span class="text-body-sm text-primary font-medium">Low (&lt; 50%)</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<button class="w-12 h-12 bg-white rounded-lg shadow-md flex items-center justify-center text-primary hover:bg-slate-50">
<span class="material-symbols-outlined">add</span>
</button>
<button class="w-12 h-12 bg-white rounded-lg shadow-md flex items-center justify-center text-primary hover:bg-slate-50">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="w-12 h-12 bg-white rounded-lg shadow-md flex items-center justify-center text-primary hover:bg-slate-50">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</div>
</div>
<!-- Layer Toggle -->
<div class="absolute top-20 right-6 z-30 flex flex-col gap-2">
<button class="bg-white px-4 py-2 rounded-full shadow-md flex items-center gap-2 text-body-sm font-medium text-primary">
<span class="material-symbols-outlined text-sm">layers</span>
                Satellite Hybrid
            </button>
<button class="bg-white/80 backdrop-blur-sm px-4 py-2 rounded-full shadow-md flex items-center gap-2 text-body-sm font-medium text-slate-600">
<span class="material-symbols-outlined text-sm">waves</span>
                Currents (OFF)
            </button>
</div>
<!-- Floating Chat Button -->
<div class="fixed bottom-8 right-8 z-50">
<button class="group relative flex items-center justify-center w-16 h-16 bg-[#002B49] text-white rounded-full shadow-2xl hover:scale-110 transition-all duration-300">
<div class="absolute -top-12 right-0 bg-white text-primary text-[10px] font-bold px-3 py-1 rounded-full shadow-lg border border-slate-100 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">
                    Ask AI Assistant
                </div>
<span class="material-symbols-outlined text-3xl" data-weight="fill">smart_toy</span>
</button>
</div>
</main>
<!-- BottomNavBar (Mobile only) -->
<nav class="lg:hidden flex justify-around items-center px-4 pb-safe pt-2 h-20 fixed bottom-0 w-full rounded-t-2xl z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-100 dark:border-slate-800 shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-70 touch-none transition-transform">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-[10px] font-bold uppercase mt-1">Dash</span>
</div>
<div class="flex flex-col items-center justify-center text-[#002B49] dark:text-sky-400 scale-110 touch-none transition-transform">
<span class="material-symbols-outlined">map</span>
<span class="text-[10px] font-bold uppercase mt-1">Map</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-70 touch-none transition-transform">
<span class="material-symbols-outlined">list_alt</span>
<span class="text-[10px] font-bold uppercase mt-1">Logs</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-70 touch-none transition-transform">
<span class="material-symbols-outlined">psychology</span>
<span class="text-[10px] font-bold uppercase mt-1">AI</span>
</div>
</nav>
</body></html>
